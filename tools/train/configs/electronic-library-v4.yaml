# The library fine-tune, fourth recipe: v2 with the labels a second teacher will not confirm
# at the octave taken out. v2 epoch 76 is what ships in 0.9.1 (§7.13.6) and v3 lost, so this
# starts from v2 and changes one thing.
#
# CORRECTED 2026-09-26: it changed two. The run trained the library's half-time tracks from
# their halved .gt.npy and selected its epoch against them at full time, because a re-layout
# minutes before it started had dropped octave.py's fields from the manifest (TRACKING-PROPOSAL.md §7.16's
# correction; see electronic-library-v5.yaml). finetune.py now refuses that state.
#
# What changed from electronic-library-v2.yaml, and why:
#   - `teacher_octave_cross` joins exclude_flags. Every library label came from Beat This!,
#     and v2's `teacher_disagree` is the spread of three of its own *seeds* — which measures
#     that model's variance, not its bias. madmom's RNN + DBN is a different lineage, and on
#     2026-09-11 it was run over the whole library (tools/train/teacher_agree.py,
#     references/datasets/library/teacher_cross.tsv): **157 tracks sit a whole octave from
#     the label, the seed filter catches 13 of them, and 126 are training data today**. The
#     three seeds agree with each other at a mean of 0.856 on exactly those tracks — they are
#     confidently wrong together. The octave is §7.13.2's central failure mode, so these are
#     the labels worth dropping first.
#   - Nothing else moves. `teacher_disagree_cross` (the second teacher below 0.7 beat F,
#     220 tracks, 126 of them trained) is measured and recorded by layout.py but **not**
#     excluded here: madmom is weaker than Beat This! on electronic music by the Raveform
#     paper's own numbers, so a low score is as likely to be madmom failing as the label
#     being wrong, while an octave is a disagreement about a fact. One variable at a time,
#     for §7.13.5's reason — v2 and v3 differed in one thing and the harness could say which.
#
# The two flags overlap by 81 of 171; if this wins, the cross-disagree half is the next
# thing to try, not a second change to fold in here.
#
# Use it to exclude or downweight, **never to relabel** (§7.15): a disagreement means the
# label has no independent confirmation, not that the second teacher is right.
name: electronic-library-v4
pretrained: references/beatnet-plus/src/BeatNetPlus/models/generic_weights.pt
sets:
  library: 3
  raveform: 1
  osu2beat: 1
  ballroom: 1
max_bpm:
  osu2beat: 160
genre_weights:
  ballroom:
    Quickstep: 3
    VienneseWaltz: 2
    Waltz: 3
harmonix_genres: ["Dance/Electronic"]
exclude_flags: [held_out, duration_mismatch, few_beats, misaligned, drifting, teacher_disagree, teacher_octave_cross]
exclude_flags_per_set:
  harmonix: [unverified]
alignment_exempt_sets: [ballroom]

seq_len: 750
batch_size: 40
learning_rate: 0.0002
class_weights: [60, 200, 1]
grad_clip: 0.0
l2sp: 0.0
stretch: [1.0, 1.0]
stretch_prob: 0.0
stretch_min_bpm: 0
max_epochs: 200
val_every: 4
patience: 8
checkpoint_every: 8

val_tracks_per_set: 80
val_seconds: 120
val_decoder: cli
val_bpm: "off"
val_meters: "4"
cli_jobs: 8
gate_set: ballroom
gate_margin: 0.05
select_sets: [library]

seed: 42
num_workers: 2
dbn_workers: 2
device: cuda
limit_tracks: 0
