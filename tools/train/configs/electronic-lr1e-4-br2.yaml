# Experiment: the electronic fine-tune at a fifth of BeatNet+'s learning rate with
# Ballroom twice in every epoch. At 5e-4 (configs/electronic.yaml) the model narrowed its
# tempo range within two epochs — Quicksteps at 204 BPM decoded at half time, slow Waltzes
# at double time — and Ballroom fell from 0.966 to 0.91 beat F, under the gate, while
# Raveform and osu2beat gained 0.05–0.08. This is the gentler counter.
name: electronic-lr1e-4-br2
pretrained: references/beatnet-plus/src/BeatNetPlus/models/generic_weights.pt
sets:
  raveform: 1
  osu2beat: 1
  harmonix: 1
  ballroom: 2
harmonix_genres: ["Dance/Electronic"]
exclude_flags: [held_out, duration_mismatch, few_beats, misaligned, drifting]
exclude_flags_per_set:
  harmonix: [unverified]
alignment_exempt_sets: [ballroom]

seq_len: 750
batch_size: 40
learning_rate: 0.0001
class_weights: [60, 200, 1]
grad_clip: 0.0
l2sp: 0.0
max_epochs: 300
val_every: 2
patience: 15
checkpoint_every: 10

val_tracks_per_set: 80
val_seconds: 120
gate_set: ballroom
gate_margin: 0.01
select_sets: [raveform, osu2beat, harmonix]

seed: 42
num_workers: 4
dbn_workers: 4
device: cuda
limit_tracks: 0
