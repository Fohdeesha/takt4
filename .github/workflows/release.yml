name: release

# A release is built here, from its tag — by the user's choice on 2026-09-23 (the audit found
# releases built by hand from a working tree, with a different compiler than CI, and v0.9.7
# published before CI had finished). Pushing an annotated tag `vX.Y.Z` checks full.yml passed on
# that commit, builds it on a clean runner, checks the binary names the tag as its commit, and
# attaches the executables and their symbols to the GitHub Release for the tag, with the tag's
# message as the notes. The PDBs go with them because a crash report without them cannot be read
# (the audit noted 0.9.4-0.9.6 shipped none).
#
# **No tests of its own since 2026-10-03**, the user's call: they were full.yml's windows-msvc
# job over again, on the same commit with the same preset — twenty minutes of every release spent
# repeating an answer already given. The check below is what stands in for them.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # To read whether full.yml passed on the commit being released.
  actions: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Every tag and every commit, so `git describe` names the tag rather than a hash.
          fetch-depth: 0
          # Not left in .git/config for the rest of the job (the audit of 2026-09-25, B4): this
          # token can write releases, and every cargo build script and FetchContent step below
          # runs with the checkout readable. Nothing here pushes; the last step hands the token
          # to `gh` itself.
          persist-credentials: false

      # A tag that is not the version in CMakeLists.txt would build a binary that calls itself
      # something else. Refused before anything is built.
      - name: The tag is the version
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          echo "CMakeLists.txt says $version; the tag is $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Every test — windows-msvc's `-all` suite, which is what this workflow used to run again,
      # and AddressSanitizer and ThreadSanitizer besides — has to have passed on this very commit
      # in full.yml. Refused before anything is built when it has not: push to main, let full go
      # green, then tag. The commit is the tag's, peeled, not GITHUB_SHA, so an annotated tag is
      # never mistaken for the commit it names.
      - name: full passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/full.yml/runs?head_sha=$sha&status=success" --jq '.total_count')
          echo "full.yml runs that passed on $sha: $passed"
          if [ "$passed" -lt 1 ]; then
            echo "::error::full.yml has not passed on $sha. Let it go green on main, then rerun this."
            exit 1
          fi

      - name: Toolchain versions
        run: |
          cmake --version
          rustc --version || true
          cargo --version || true

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc --parallel

      # What the release will say about itself: the tag exactly — not "-dirty", not a commit
      # after it. `--version` prints "commit: <git describe>".
      - name: The binaries name the tag
        run: |
          bin=build/windows-msvc/bin/Release
          "$bin/takt4.exe" --version | tee app.txt
          "$bin/takt4-cli.exe" --version | tee cli.txt
          grep -qx "  commit:        $GITHUB_REF_NAME" app.txt
          grep -qx "  commit:        $GITHUB_REF_NAME" cli.txt

      - name: Package
        run: |
          bin=build/windows-msvc/bin/Release
          mkdir dist
          cp "$bin/takt4.exe" "$bin/takt4.pdb" "$bin/takt4-cli.exe" "$bin/takt4-cli.pdb" dist/
          cp LICENSE dist/
          if [ -f THIRD-PARTY-NOTICES.txt ]; then cp THIRD-PARTY-NOTICES.txt dist/; fi
          ls -l dist

      # Attached to the Release for this tag: created from the tag's message if there is none
      # yet, and the files replaced if one was already made by hand.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag \
              --title "takt4 $VERSION"
          fi
